<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <title>Jajo PL — Formularz do sparingu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet" />
</head>

<body>
    <header class="main-header">
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="Logo Drużyny Jajo PL" class="logo-img">
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="history.html" class="active">Historia</a></li>
                <li><a href="gallery.html">Galeria i Skład</a></li>
                <li><a href="contact.html" class="active">Formularz do sparingu</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="contact-section">
            <h1>Umów sparing lub skontaktuj się z nami</h1>
            <p>Chcesz zagrać mecz treningowy przeciwko Jajo PL lub dołączyć do naszej akademii? Wypełnij poniższy
                formularz.</p>

            <form id="sparing-form" class="contact-form">
                <div class="form-group">
                    <label for="team-name">Nazwa Twojej drużyny / Nick:</label>
                    <input type="text" id="team-name" name="team-name" placeholder="np. Husaria Esport" required
                        minlength="2" />
                </div>

                <div class="form-group">
                    <label for="email">Adres e-mail do kontaktu:</label>
                    <input type="email" id="email" name="email" placeholder="kontakt@twojadruzyna.pl" required />
                </div>

                <div class="form-group">
                    <label for="topic">Wybierz temat wiadomości:</label>
                    <select id="topic" name="topic" required>
                        <option value="">-- Wybierz opcję --</option>
                        <option value="sparing-bo1">Propozycja sparingu (BO1 - Mirage / Inferno)</option>
                        <option value="sparing-bo3">Propozycja sparingu (BO3 - pełny mecz)</option>
                        <option value="rekrutacja">Rekrutacja do drużyny</option>
                        <option value="wspolpraca">Współpraca / Inne</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Treść wiadomości (np. proponowana data, godzina i link do Faceit):</label>
                    <textarea id="message" name="message" rows="5" placeholder="Napisz, kiedy pasuje Wam zagrać..."
                        required minlength="10"></textarea>
                </div>

                <button type="submit" class="submit-btn">Wyślij zgłoszenie</button>
            </form>

            <p id="form-status" class="form-status" hidden></p>
        </section>
    </main>

    <footer>
        <div class="footer-links">
            <a href="https://www.facebook.com/profile.php?id=61591420666282" target="_blank">Facebook Drużyny</a>
        </div>
        <p>Wykonał: Bartłomiej Kukuła</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
